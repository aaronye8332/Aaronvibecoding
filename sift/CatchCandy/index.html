<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Launch CatchCandy</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1b1038, #3b1a6b);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .panel {
      background: rgba(0,0,0,0.25);
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 16px;
      padding: 24px 28px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(0,0,0,0.25);
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 999px;
      background: #ff7a00;
      color: white;
      cursor: pointer;
      font-weight: bold;
      margin-top: 12px;
    }
    .status {
      margin-top: 10px;
      color: #f8f0c4;
      min-height: 24px;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>CatchCandy Launcher</h1>
    <p>Start the Python game from this page.</p>
    <button onclick="launchGame()">Run python3 game.py</button>
    <div id="status" class="status">Waiting...</div>
  </div>

  <script>
    async function launchGame() {
      const status = document.getElementById('status');
      status.textContent = 'Starting game...';
      try {
        const response = await fetch('/run-game');
        const data = await response.json();
        if (data.status === 'started') {
          status.textContent = 'Game started successfully.';
        } else {
          status.textContent = 'Could not start the game.';
        }
      } catch (err) {
        status.textContent = 'Error: make sure the launcher server is running.';
      }
    }
  </script>
</body>
</html>
