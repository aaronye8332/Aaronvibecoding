<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Links</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #071a2e, #103d63, #3f9bd9);
      color: #ffffff;
      overflow: hidden;
    }

    .page-shell {
      width: min(92vw, 700px);
      padding: 24px;
    }

    .hero-card {
      background: rgba(8, 24, 40, 0.78);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2.4rem, 5vw, 3.8rem);
      text-transform: uppercase;
      letter-spacing: 0.2rem;
      animation: fadeInTitle 1.2s ease both;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.4), 0 5px 0 rgba(0, 0, 0, 0.2), 0 9px 12px rgba(0, 0, 0, 0.3);
    }

    .subtitle {
      margin: 0 0 22px;
      font-size: 1.15rem;
      opacity: 0.95;
      animation: fadeInTitle 1.25s ease both;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.3);
    }

    .links-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 14px;
    }

    .links-list li {
      opacity: 0;
      animation: bounceIn 1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .links-list li:nth-child(2) {
      animation-delay: 0.2s;
    }

    .links-list li:nth-child(3) {
      animation-delay: 0.4s;
    }

    .links-list a {
      display: block;
      padding: 14px 18px;
      border-radius: 16px;
      text-decoration: none;
      font-size: 1.2rem;
      font-weight: 800;
      color: #ffffff;
      background: linear-gradient(145deg, #0aa3ff, #0b6eb0);
      box-shadow: 0 8px 0 rgba(0, 0, 0, 0.25), 0 10px 20px rgba(0, 0, 0, 0.2);
      text-shadow: 0 2px 2px rgba(0, 0, 0, 0.35), 0 1px 0 #0a3c60;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .links-list a:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 12px 0 rgba(0, 0, 0, 0.25), 0 14px 24px rgba(0, 0, 0, 0.3);
    }

    .links-list a:active {
      transform: translateY(1px) scale(0.99);
    }

    .stage {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .trampoline {
      width: 220px;
      height: 18px;
      background: linear-gradient(90deg, #c7f0ff, #47b5ff, #0b6eb0);
      border-radius: 999px;
      box-shadow: inset 0 -6px 0 rgba(0, 0, 0, 0.16);
      position: relative;
    }

    .trampoline::before {
      content: "";
      position: absolute;
      inset: -10px 0 auto 0;
      height: 16px;
      border-radius: 999px;
      background: linear-gradient(90deg, #ffffff, #8fdfff, #3f9bd9);
      opacity: 0.8;
    }

    .soccer-ball {
      position: relative;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 4px solid #2b2b2b;
      background: radial-gradient(circle at 30% 30%, #ffffff, #dbdbdb 15%, #7a7a7a 45%, #2d2d2d 100%);
      box-shadow: inset -4px -6px 8px rgba(0, 0, 0, 0.4), 0 8px 12px rgba(0, 0, 0, 0.25);
      animation: bounceBall 1.35s infinite ease-in-out;
      transform-origin: bottom center;
      margin-top: -18px;
    }

    .soccer-ball::before {
      content: "";
      position: absolute;
      inset: 12px 10px auto;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
    }

    @keyframes fadeInTitle {
      from {
        opacity: 0;
        transform: translateY(-14px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes bounceIn {
      0% {
        opacity: 0;
        transform: translateY(26px) scale(0.82);
      }
      65% {
        opacity: 1;
        transform: translateY(-6px) scale(1.03);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes bounceBall {
      0%,
      100% {
        transform: translateY(0) scale(1);
      }
      25% {
        transform: translateY(-100px) scale(1.03);
      }
      50% {
        transform: translateY(0) scale(1);
      }
      75% {
        transform: translateY(-34px) scale(1);
      }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <section class="hero-card">
      <h1>Game Links</h1>
      <p class="subtitle">Choose a link to open.</p>
      <ul class="links-list">
        <li><a href="Catch%20candy/">Catch candy</a></li>
        <li><a href="tennis/">Tennis</a></li>
        <li><a href="resume/">Resume</a></li>
      </ul>

      <div class="stage" aria-hidden="true">
        <div class="soccer-ball"></div>
        <div class="trampoline"></div>
      </div>
    </section>
  </main>
</body>
</html>
